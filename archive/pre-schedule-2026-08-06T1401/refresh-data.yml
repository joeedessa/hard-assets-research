name: Refresh market data

on:
  schedule:
    # 21:30 UTC weekdays — after US market close
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance feedparser

      - name: Run fetch script
        run: python scripts/fetch_market.py

      - name: Validate output JSON
        run: |
          for f in data/quotes.json data/indices.json data/alerts.json data/performance.json; do
            python -c "import json,sys; json.load(open('$f')); print('OK:', '$f')"
          done
          # news.json may be empty array — still must be valid JSON
          python -c "import json; json.load(open('data/news.json'))"

      - name: Commit data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json data/indices.json data/news.json data/alerts.json data/performance.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit"
          else
            # Commit BEFORE pulling. `git pull --rebase` refuses to run with a
            # dirty index, so doing it after `git add` failed every night with
            # "cannot pull with rebase: Your index contains uncommitted changes".
            git commit -m "chore: nightly data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
