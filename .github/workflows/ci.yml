name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all data JSON
        run: |
          for f in data/*.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('OK:', '$f')"
          done

      - name: Syntax-check widget JavaScript
        run: |
          # Extract all <script> blocks from widget and syntax-check with node
          python3 - <<'EOF'
          import re, subprocess, sys, tempfile, os, pathlib

          widget = pathlib.Path("widgets/widget_combined.html").read_text()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', widget, re.DOTALL)
          js = "\n".join(scripts)
          with tempfile.NamedTemporaryFile(suffix=".js", mode="w", delete=False) as f:
              f.write(js)
              fname = f.name
          r = subprocess.run(["node", "--check", fname], capture_output=True, text=True)
          os.unlink(fname)
          if r.returncode != 0:
              print("Widget JS syntax error:", r.stderr, file=sys.stderr)
              sys.exit(1)
          print("Widget JS syntax OK")
          EOF
