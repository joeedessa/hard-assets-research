name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all data JSON
        run: |
          for f in data/*.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('OK:', '$f')"
          done

      # The two HTML copies drifting apart is a silent failure: you get two
      # dashboards that disagree and no signal about which one is stale.
      # index.html is the source; the widget copy is generated from it.
      - name: Widget copy is in sync with index.html
        run: python3 scripts/sync_widget.py --check

      - name: Syntax-check app JavaScript
        run: |
          # Each HTML copy is checked SEPARATELY. Concatenating them collides on
          # every top-level const, since they are two copies of the same app.
          python3 - <<'EOF'
          import re, subprocess, sys, tempfile, os, pathlib

          failed = False
          for name in ["index.html", "widgets/widget_combined.html"]:
              path = pathlib.Path(name)
              if not path.exists():
                  print(f"skip (absent): {name}")
                  continue
              blocks = re.findall(r'<script[^>]*>(.*?)</script>', path.read_text(), re.DOTALL)
              js = "\n".join(blocks)
              with tempfile.NamedTemporaryFile(suffix=".js", mode="w", delete=False) as fh:
                  fh.write(js)
                  tmp = fh.name
              r = subprocess.run(["node", "--check", tmp], capture_output=True, text=True)
              os.unlink(tmp)
              if r.returncode != 0:
                  print(f"JS syntax error in {name}:\n{r.stderr}", file=sys.stderr)
                  failed = True
              else:
                  print(f"JS syntax OK: {name}")
          sys.exit(1 if failed else 0)
          EOF
