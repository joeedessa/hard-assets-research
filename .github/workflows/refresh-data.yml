name: Refresh market data

# Four passes a day, timed to the sessions this universe actually spans. Miners
# skew ASX/TSX/LSE/JSE, so the slots differ from a US-only map. Cron is UTC and
# ignores DST, so each slot carries ~1h of buffer rather than chasing the clock.
on:
  schedule:
    - cron: '45 6 * * 1-5'    # Asia post-close    — Tokyo 15:00, Taipei 13:30, ASX 16:00 AEST
    - cron: '45 12 * * 1-5'   # US pre-open        — BMO releases ~12:30; Europe mid-session
    - cron: '0 16 * * 1-5'    # Europe post-close  — London 16:30, Frankfurt/Paris 17:30
    - cron: '30 21 * * 1-5'   # US post-close      — AMC releases + full end-of-day rebuild
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = everything; light = prices, signals and reporting names only'
        default: full
        type: choice
        options: [full, light]

permissions:
  contents: write

# Only the evening pass rebuilds everything. The three intraday passes run light.
env:
  FETCH_MODE: >-
    ${{ github.event_name == 'schedule'
        && (github.event.schedule == '30 21 * * 1-5' && 'full' || 'light')
        || inputs.mode || 'full' }}

# Passes must not overlap — two writers on the same files would corrupt a commit.
concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # lxml is required by yfinance for earnings_dates/calendar; without it the
      # calls fail silently and the agenda comes back empty.
      - name: Install dependencies
        run: pip install --quiet yfinance feedparser lxml

      - name: Fetch market data (${{ env.FETCH_MODE }})
        run: python scripts/fetch_market.py

      - name: Validate output
        run: |
          python - <<'EOF'
          import json, glob
          for f in sorted(glob.glob('data/*.json')):
              json.load(open(f))
          print('all data/*.json parse')
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json data/indices.json data/news.json data/alerts.json \
                  data/performance.json data/breaking.json data/calendar.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit"
          else
            # Commit BEFORE pulling: git pull --rebase refuses to run on a dirty index.
            git commit -m "chore: market data refresh (${FETCH_MODE}) $(date -u +%Y-%m-%dT%H:%MZ)"
            # ...and refuses again on unstaged changes. The pipeline may touch a
            # file that is not in the add list above (calendar.json did exactly
            # this and broke the 2026-08-05 run). Everything here is regenerated
            # output, so discarding the remainder is safe and keeps the rebase clean.
            git checkout -- . || true
            git clean -fd data/ || true
            git pull --rebase origin main
            git push
          fi
